name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the test job needs nothing beyond the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (not moving tags); bumped via Dependabot.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/*.mjs
