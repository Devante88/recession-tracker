name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the test job needs nothing beyond the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (not moving tags); bumped via Dependabot.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/*.mjs
