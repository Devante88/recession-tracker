name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: the test job needs nothing beyond the checkout.
permissions:
  contents: read

# GitHub forces JS actions onto Node 24 from 2026-06-16; opt in early so the
# cutover is exercised before the deadline.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to immutable commit SHAs (not moving tags); bumped via Dependabot.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/*.mjs
