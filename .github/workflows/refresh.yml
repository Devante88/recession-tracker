name: Refresh FRED Data

on:
  schedule:
    # Daily at 13:00 UTC (08:00 CT) — after FRED's typical morning releases
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/*.mjs

      - name: Check FRED connectivity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          echo "API key set: $([ -n "$FRED_API_KEY" ] && echo yes || echo NO — secret missing)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.stlouisfed.org/fred/series/observations?series_id=T10Y3M&api_key=${FRED_API_KEY}&file_type=json&limit=1")
          echo "FRED probe HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::FRED API returned $STATUS — check FRED_API_KEY secret and API quota"
            exit 1
          fi

      - name: Fetch FRED data and compute snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: node scripts/fetch.mjs

      - name: Generate RSS feed for alert state changes
        run: node scripts/feed.mjs

      - name: Generate AI narrative briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/narrative.mjs

      - name: Send webhook alert on state change
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: node scripts/alert.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ docs/feed.xml docs/data/alert-log.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
