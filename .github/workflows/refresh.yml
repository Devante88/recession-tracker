name: Refresh FRED Data

on:
  schedule:
    # Target: ~07:00 America/Chicago (Central), every day. GitHub cron is UTC
    # and does not observe daylight saving, so we fire at both candidate hours
    # and a gate below passes any run that arrives 06:00–10:59 Central (the
    # wide window absorbs GitHub's up-to-4-hour scheduling delay under load).
    #   12:00 UTC → 07:00 CDT (Mar–Nov, summer) or 06:00 CST (Nov–Mar, winter)
    #   13:00 UTC → 08:00 CDT (Mar–Nov, summer) or 07:00 CST (Nov–Mar, winter)
    - cron: '0 12 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (e.g. major announcement affecting the track)'
        required: false
        default: 'Manual weekend / off-schedule refresh'

# Least privilege by default: the workflow token is read-only, and each job
# that needs more (push a commit, file an issue) opts in explicitly below.
permissions:
  contents: read

# GitHub forces JS actions onto Node 24 from 2026-06-16; opt in early so the
# cutover is exercised before the deadline (the pinned checkout/setup-node
# SHAs run fine on Node 24; Dependabot will bump them to v5+ over time).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate job: lets manual runs through always, and allows scheduled runs when
  # the wall-clock time in Central is between 06:00 and 10:59. This window
  # tolerates up to ~4 hours of GitHub Actions scheduling delay, which the
  # platform can impose under high load. The two crons (12:00 and 13:00 UTC)
  # target 07:00 Central but may fire several hours late; a strict == "07"
  # check causes every delayed run to be silently skipped. Both crons can pass
  # the window on the same day — that is intentional and harmless: the second
  # run finds no staged changes and exits with "No changes to commit".
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Decide whether to run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual / non-scheduled trigger — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CENTRAL_HOUR=$(TZ='America/Chicago' date +%H | sed 's/^0//')
          echo "Current Central hour: ${CENTRAL_HOUR}"
          if [ "$CENTRAL_HOUR" -ge 6 ] && [ "$CENTRAL_HOUR" -le 10 ]; then
            echo "Within morning window (06:00–10:59 Central) — proceeding with refresh."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Outside morning window (Central hour ${CENTRAL_HOUR}) — skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    # Only this job writes — it commits the refreshed snapshot back to main.
    permissions:
      contents: write
    steps:
      # Actions pinned to immutable commit SHAs (not moving tags) so a
      # compromised upstream release cannot silently alter what runs here.
      # Dependabot (.github/dependabot.yml) proposes SHA bumps via PR.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/*.mjs

      - name: Check FRED API key and connectivity (diagnostic only)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          KEY=$(printf '%s' "${FRED_API_KEY}" | tr -d '[:space:]')
          echo "API key set: $([ -n "$KEY" ] && echo yes || echo 'NO — FRED_API_KEY secret missing')"
          echo "API key length: ${#KEY}"
          if [ -z "$KEY" ]; then
            echo "::warning::FRED_API_KEY secret is not set — fetch will fail. Add it under Settings → Secrets → Actions."
            exit 0
          fi
          STATUS=$(curl -s -o /tmp/fred_probe.json -w "%{http_code}" \
            -H "User-Agent: recession-tracker/1.0 (github.com/Devante88/recession-tracker)" \
            "https://api.stlouisfed.org/fred/series/observations?series_id=T10Y3M&api_key=${KEY}&file_type=json&limit=1")
          echo "FRED probe HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "FRED API reachable and key valid."
          else
            echo "::warning::FRED probe returned $STATUS — fetch may fail (transient block or bad key). Response:"
            cat /tmp/fred_probe.json
          fi

      - name: Validate FRED series IDs still return data
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          export FRED_API_KEY=$(printf '%s' "${FRED_API_KEY}" | tr -d '[:space:]')
          node scripts/validate-series.mjs

      - name: Archive prior snapshot for change tracking
        run: |
          if [ -f docs/data/current.json ]; then
            cp docs/data/current.json docs/data/previous.json
            echo "Archived current.json -> previous.json"
          else
            echo "No existing snapshot to archive (first run)"
          fi

      - name: Ingest GPR geopolitical risk index (optional)
        env:
          GPR_DATA_URL: ${{ secrets.GPR_DATA_URL }}
        run: node scripts/gpr.mjs

      - name: Fetch FRED data and compute snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          export FRED_API_KEY=$(printf '%s' "${FRED_API_KEY}" | tr -d '[:space:]')
          node scripts/fetch.mjs

      - name: Generate RSS feed for alert state changes
        run: node scripts/feed.mjs

      - name: Validate snapshot integrity before publishing
        run: node scripts/check-snapshot.mjs

      - name: Generate AI narrative briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/narrative.mjs

      - name: Send webhook alert on state change
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SUPABASE_NOTIFY_URL: ${{ secrets.SUPABASE_NOTIFY_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: node scripts/alert.mjs

      - name: Send email alert on state change
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node scripts/email-alert.mjs

      - name: Send weekly summary (Mondays only)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node scripts/weekly-summary.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ docs/feed.xml docs/data/alert-log.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          fi

  # Open (or update) a GitHub issue when a refresh that should have run fails.
  # GitHub emails repo watchers on new issues / comments, so a silent failure
  # becomes a visible alert. De-duplicates onto one open issue to avoid spam.
  notify-failure:
    needs: [gate, refresh]
    if: always() && needs.gate.outputs.proceed == 'true' && needs.refresh.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update failure alert issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          LABEL="refresh-failure"

          REPO="Devante88/recession-tracker"

          # Ensure the label exists (ignore error if it already does).
          gh label create "$LABEL" --color B60205 \
            --description "Automated data refresh failed" \
            --repo "$REPO" 2>/dev/null || true

          # Build the issue body with printf (one quoted line per arg). This stays
          # fully indented inside the YAML block scalar and avoids heredoc-terminator
          # issues, while producing left-aligned Markdown.
          printf '%s\n' \
            "The scheduled FRED data refresh failed." \
            "" \
            "- **When:** ${TODAY} (07:00 Central scheduled run)" \
            "- **Failed run:** ${RUN_URL}" \
            "" \
            "The dashboard keeps showing the last good snapshot and displays a" \
            "staleness banner until a refresh succeeds." \
            "" \
            "**Common causes**" \
            "1. \`FRED_API_KEY\` secret missing or expired — check the *Check FRED connectivity* step in the failed run." \
            "2. FRED API quota exceeded or a temporary outage." \
            "3. A series ID was retired — see the *Validate FRED series IDs* step." \
            "" \
            "Re-run from the Actions tab once resolved. This issue auto-closes when a later refresh succeeds." \
            > /tmp/alert-body.md

          # Find an existing open alert to comment on instead of opening a new one.
          EXISTING=$(gh issue list --state open --label "$LABEL" \
            --repo "$REPO" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing alert #${EXISTING}"
            gh issue comment "$EXISTING" --body "Refresh failed again on ${TODAY}. Run: ${RUN_URL}" --repo "$REPO"
          else
            echo "Opening new alert issue"
            # Create without --label first (avoids silent failure if label creation above failed),
            # then add the label in a second step.
            ISSUE_NUM=$(gh issue create \
              --title "⚠ Data refresh failed (${TODAY})" \
              --body-file /tmp/alert-body.md \
              --repo "$REPO" \
              --json number --jq '.number' 2>/dev/null || echo "")
            if [ -n "$ISSUE_NUM" ]; then
              gh issue edit "$ISSUE_NUM" --add-label "$LABEL" --repo "$REPO" 2>/dev/null || true
              echo "Opened issue #${ISSUE_NUM}"
            else
              echo "::warning::Failed to create failure alert issue"
            fi
          fi

  # When a refresh succeeds, close any open failure alert so the issue list
  # reflects current health.
  resolve-alert:
    needs: [gate, refresh]
    if: always() && needs.gate.outputs.proceed == 'true' && needs.refresh.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close open failure alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="Devante88/recession-tracker"
          for n in $(gh issue list --state open --label "refresh-failure" \
            --repo "$REPO" --json number --jq '.[].number' 2>/dev/null); do
            echo "Closing resolved alert #${n}"
            gh issue close "$n" --repo "$REPO" \
              --comment "✅ Refresh succeeded on $(date -u +%Y-%m-%d). Closing automatically."
          done
