name: Refresh FRED Data

on:
  schedule:
    # Target: 07:00 America/Chicago (Central), Mon–Fri. GitHub cron is UTC and
    # does NOT observe daylight saving, so we fire at both candidate UTC hours
    # and a guard step below skips whichever one isn't actually 07:00 Central.
    #   12:00 UTC = 07:00 CDT (Mar–Nov, daylight)
    #   13:00 UTC = 07:00 CST (Nov–Mar, standard)
    - cron: '0 12 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger (e.g. major announcement affecting the track)'
        required: false
        default: 'Manual weekend / off-schedule refresh'

permissions:
  contents: write

jobs:
  # Gate job: lets manual runs through always, but allows a scheduled run only
  # when it is exactly 07:00 in Central time. Because we schedule at both 12:00
  # and 13:00 UTC, exactly one of the two passes per day year-round (the other
  # is the DST shadow and is skipped here).
  gate:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Decide whether to run
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual / non-scheduled trigger — proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CENTRAL_HOUR=$(TZ='America/Chicago' date +%H)
          echo "Current Central hour: ${CENTRAL_HOUR}"
          if [ "$CENTRAL_HOUR" = "07" ]; then
            echo "It is 07:00 Central — proceeding with refresh."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 07:00 Central (DST shadow run) — skipping this trigger."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    if: needs.gate.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests
        run: node --test tests/*.mjs

      - name: Validate FRED series IDs still return data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          export FRED_API_KEY=$(printf '%s' "${FRED_API_KEY}" | tr -d '[:space:]')
          node scripts/validate-series.mjs

      - name: Check FRED connectivity
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          KEY=$(printf '%s' "${FRED_API_KEY}" | tr -d '[:space:]')
          echo "API key set: $([ -n "$KEY" ] && echo yes || echo NO — secret missing)"
          echo "API key length: ${#KEY}"
          curl -s -o /tmp/fred_probe.json -w "%{http_code}" \
            -H "User-Agent: recession-tracker/1.0 (github.com/Devante88/recession-tracker)" \
            "https://api.stlouisfed.org/fred/series/observations?series_id=T10Y3M&api_key=${KEY}&file_type=json&limit=1" \
            > /tmp/fred_status.txt
          STATUS=$(cat /tmp/fred_status.txt)
          echo "FRED probe HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::FRED API returned $STATUS — check FRED_API_KEY secret and API quota"
            echo "Response body:"
            cat /tmp/fred_probe.json
            exit 1
          fi

      - name: Archive prior snapshot for change tracking
        run: |
          if [ -f docs/data/current.json ]; then
            cp docs/data/current.json docs/data/previous.json
            echo "Archived current.json -> previous.json"
          else
            echo "No existing snapshot to archive (first run)"
          fi

      - name: Ingest GPR geopolitical risk index (optional)
        env:
          GPR_DATA_URL: ${{ secrets.GPR_DATA_URL }}
        run: node scripts/gpr.mjs

      - name: Fetch FRED data and compute snapshot
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          export FRED_API_KEY=$(printf '%s' "${FRED_API_KEY}" | tr -d '[:space:]')
          node scripts/fetch.mjs

      - name: Generate RSS feed for alert state changes
        run: node scripts/feed.mjs

      - name: Generate AI narrative briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/narrative.mjs

      - name: Send webhook alert on state change
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          SUPABASE_NOTIFY_URL: ${{ secrets.SUPABASE_NOTIFY_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
        run: node scripts/alert.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/ docs/feed.xml docs/data/alert-log.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: refresh snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
