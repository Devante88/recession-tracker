version: 2
updates:
  # Keep the GitHub Actions pinned by SHA in refresh.yml / test.yml up to date.
  # Dependabot opens a PR when a newer release of a pinned action exists, bumping
  # the SHA and the trailing "# vX.Y.Z" comment together, so pinning stays
  # maintainable instead of going stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
